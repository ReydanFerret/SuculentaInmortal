name: Build Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer (.exe)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Sin certificado: que electron-builder no intente buscar uno ni publicar nada.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build installer and portable app
        run: npm run windows:dist

      - name: List build output
        if: always()
        run: ls -la release/windows || true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: suculenta-inmortal-windows
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 30
